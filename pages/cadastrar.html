<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>GaloPassaporte - Cadastrar</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>

    <h1>GaloPassaporte</h1>

    <nav>
        <ul>
            <li><a href="../index.html">Início</a></li>
            <li><a href="cadastrar.html">Cadastrar jogo</a></li>
            <li><a href="jogos.html">Meus jogos</a></li>
            <li><a href="futuros.html">Quero ir</a></li>
        </ul>
    </nav>

</header>

<main>

    <section>

        <h2>Cadastrar experiência</h2>

        <p>
            Cadastre uma partida do Atlético Mineiro
            que você acompanhou.
        </p>

        <form>

            <label for="adversario">Adversário</label>
            <input type="text" id="adversario" name="adversario">

            <label for="competicao">Competição</label>

            <select id="competicao" name="competicao">
                <option>Campeonato Brasileiro</option>
                <option>Copa do Brasil</option>
                <option>Campeonato Mineiro</option>
                <option>Copa Libertadores</option>
            </select>

            <label for="data">Data</label>
            <input type="date" id="data" name="data">

            <label for="horario">Horário</label>
            <input type="time" id="horario" name="horario">

            <label for="estadio">Estádio</label>
            <input type="text" id="estadio" name="estadio">

            <label for="placar">Placar</label>
            <input type="text" id="placar" name="placar">

            <h3>Ingresso digital</h3>

            <label for="setor">Setor</label>
            <input type="text" id="setor" name="setor">

            <label for="portao">Portão</label>
            <input type="text" id="portao" name="portao">

            <label for="cadeira">Cadeira</label>
            <input type="text" id="cadeira" name="cadeira">

            <h3>Avaliação</h3>

            <label for="lotacao">Lotação</label>

            <select id="lotacao" name="lotacao">
                <option>1 - Muito ruim</option>
                <option>2 - Ruim</option>
                <option>3 - Regular</option>
                <option>4 - Boa</option>
                <option>5 - Excelente</option>
            </select>

            <label for="clima">Clima</label>

            <select id="clima" name="clima">
                <option>1 - Muito ruim</option>
                <option>2 - Ruim</option>
                <option>3 - Regular</option>
                <option>4 - Bom</option>
                <option>5 - Excelente</option>
            </select>

            <label for="recepcao">Recepção</label>

            <select id="recepcao" name="recepcao">
                <option>1 - Muito ruim</option>
                <option>2 - Ruim</option>
                <option>3 - Regular</option>
                <option>4 - Boa</option>
                <option>5 - Excelente</option>
            </select>

            <label for="vendas">Vendas e atendimento</label>

            <select id="vendas" name="vendas">
                <option>1 - Muito ruim</option>
                <option>2 - Ruim</option>
                <option>3 - Regular</option>
                <option>4 - Bom</option>
                <option>5 - Excelente</option>
            </select>

            <label for="arbitragem">Arbitragem</label>

            <select id="arbitragem" name="arbitragem">
                <option>1 - Muito ruim</option>
                <option>2 - Ruim</option>
                <option>3 - Regular</option>
                <option>4 - Boa</option>
                <option>5 - Excelente</option>
            </select>

            <label for="comentario">Comentário</label>

            <textarea
                id="comentario"
                name="comentario"
            ></textarea>

            <button type="submit">
                Cadastrar experiência
            </button>

            <button type="reset">
                Limpar
            </button>

        </form>

    </section>

</main>

<footer>

    <p>GaloPassaporte - Projeto acadêmico</p>

</footer>
<script src="../script.js"></script>
</body>

</html>
